name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Generate version string ───────────────────────────────────────────
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Build Hugo site ───────────────────────────────────────────────────
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.122.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: public/
          retention-days: 30

  # ─── Deploy to FTP Server ─────────────────────────────────────────────
  deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Deploy to FTP server
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import ftplib
          import traceback
          
          host = os.environ['FTP_HOST']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          
          print(f"FTP Host: {host}")
          print(f"FTP User: {username}")
          print(f"FTP Pass: {'*' * len(password)}")
          
          try:
              print(f"Connecting to {host}...")
              ftp = ftplib.FTP(host)
              ftp.login(username, password)
              print(f"Connected! Welcome: {ftp.getwelcome()}")
              print(f"Current dir: {ftp.pwd()}")
              
              # List files
              print("Files in root:")
              ftp.retrlines('LIST')
              
              # Upload directory recursively
              def upload_dir(local_dir, remote_dir):
                  try:
                      ftp.mkd(remote_dir)
                      print(f"Created dir: {remote_dir}")
                  except ftplib.error_perm as e:
                      if "550" in str(e):
                          pass  # Directory already exists
                      else:
                          print(f"Error creating dir {remote_dir}: {e}")

                  ftp.cwd(remote_dir)

                  for item in os.listdir(local_dir):
                      local_path = os.path.join(local_dir, item)
                      if os.path.isfile(local_path):
                          print(f"Uploading {local_path}...")
                          with open(local_path, 'rb') as f:
                              ftp.storbinary(f'STOR {item}', f)
                      elif os.path.isdir(local_path):
                          upload_dir(local_path, item)
                  ftp.cwd('..')
              
              upload_dir('build-output', '/')
              ftp.quit()
              print("Done!")
          except Exception as e:
              print(f"Error: {e}")
              traceback.print_exc()
          PYTHON_SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Summary
        run: |
          echo "### Deployed to FTP: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Tag release after deployment succeeds ─────────────────────────────
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - version
      - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy/$VERSION" -m "Deploy $VERSION"
          git push origin "deploy/$VERSION"
          echo "### Tagged: \`deploy/$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
