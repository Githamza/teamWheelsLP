name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Generate version string ───────────────────────────────────────────
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Build Hugo site ───────────────────────────────────────────────────
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: public/
          retention-days: 30

  # ─── Deploy to Azure Storage ─────────────────────────────────────────
  deploy:
    name: Deploy to Azure Storage
    runs-on: ubuntu-latest
    needs: [version, build]
    environment: production
    env:
      AZURE_CDN_PROFILE: ${{ secrets.AZURE_CDN_PROFILE }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: build-output/

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --source build-output/ \
            --destination '$web' \
            --overwrite \
            --auth-mode login

      - name: Purge CDN endpoint (optional)
        if: ${{ env.AZURE_CDN_PROFILE != '' }}
        continue-on-error: true
        run: |
          az cdn endpoint purge \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --profile-name "${{ secrets.AZURE_CDN_PROFILE }}" \
            --name "${{ secrets.AZURE_CDN_ENDPOINT }}" \
            --content-paths "/*"

      - name: Summary
        run: |
          echo "### Deployed to Azure Storage: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Tag release after deployment succeeds ─────────────────────────────
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - version
      - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy/$VERSION" -m "Deploy $VERSION"
          git push origin "deploy/$VERSION"
          echo "### Tagged: \`deploy/$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
