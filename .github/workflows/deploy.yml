name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Generate version string ───────────────────────────────────────────
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: ver
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Build Hugo site ───────────────────────────────────────────────────
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.122.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: public/
          retention-days: 30
          # v4 defaults to include-hidden-files: false, which silently
          # strips .htaccess and the entire /.well-known/ tree from the
          # artifact — breaking Link response headers and agent-discovery
          # endpoints (api-catalog, agent-skills, JWKS).
          include-hidden-files: true

  # ─── Deploy to FTP Server ─────────────────────────────────────────────
  deploy:
    name: Deploy to FTP
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-build-${{ needs.version.outputs.version }}
          path: build-output/

      # Incremental FTPS sync via a server-side state file
      # (.ftp-deploy-sync-state.json). After the first run, only changed
      # files are uploaded and removed files are deleted — a typical
      # commit becomes a handful of round-trips instead of ~2,000.
      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./build-output/
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard

      - name: Summary
        run: |
          echo "### Deployed to FTP: \`${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─── Notify search engines via IndexNow ────────────────────────────────
  indexnow:
    name: Ping IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve base ref
        id: base
        run: |
          BEFORE="${{ github.event.before }}"
          # First push / force-push leaves before=0000000…; fall back to parent.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Comparing against $BEFORE"

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow/submit.js --changed --base "${{ steps.base.outputs.ref }}"

  # ─── Tag release after deployment succeeds ─────────────────────────────
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - version
      - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy/$VERSION" -m "Deploy $VERSION"
          git push origin "deploy/$VERSION"
          echo "### Tagged: \`deploy/$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
