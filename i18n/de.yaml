- id: teams_admin_mail_subject
  translation: "Anfrage: Installation der TeamWheels-App in Microsoft Teams"
- id: teams_admin_mail_body
  translation: |
    Hallo,

    ich würde gerne TeamWheels testen, eine in Microsoft Teams integrierte Fahrgemeinschafts-App für Mitarbeitende (30 Tage kostenlos, keine Kreditkarte).

    Könnten Sie die App für unsere Organisation freigeben?

    - In Teams installieren: {{ .Install }}
    - Eintrag im Microsoft Marketplace: {{ .Marketplace }}
    - Microsoft 365 Publisher Attestation (Sicherheit, Datenverarbeitung, Compliance): {{ .Attestation }}

    Wichtigste Punkte: Anmeldung über Microsoft Entra ID (Ihre Richtlinien für bedingten Zugriff gelten), Daten in Frankreich auf Azure gehostet und im Ruhezustand verschlüsselt, keine Weitergabe von Daten an Dritte, DSGVO-konform.

    Im Teams Admin Center: Teams-Apps > Apps verwalten > nach „TeamWheels“ suchen > Zulassen.

    Vielen Dank!
