- id: teams_admin_mail_subject
  translation: "Verzoek: de TeamWheels-app installeren in Microsoft Teams"
- id: teams_admin_mail_body
  translation: |
    Hallo,

    Ik wil graag TeamWheels uitproberen, een in Microsoft Teams ingebouwde carpoolapp voor medewerkers (30 dagen gratis, geen creditcard).

    Kunt u de app toestaan voor onze organisatie?

    - Installeren in Teams: {{ .Install }}
    - Productpagina in Microsoft Marketplace: {{ .Marketplace }}
    - Microsoft 365 Publisher Attestation (beveiliging, gegevensverwerking, compliance): {{ .Attestation }}

    Belangrijkste punten: aanmelden via Microsoft Entra ID (het bestaande Conditional Access-beleid blijft van toepassing), gegevens gehost in Frankrijk op Azure en versleuteld opgeslagen, geen gegevens gedeeld met derden, AVG-conform.

    In het Teams-beheercentrum: Teams-apps > Apps beheren > zoek "TeamWheels" > Toestaan.

    Bedankt!
