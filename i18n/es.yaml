- id: teams_admin_mail_subject
  translation: "Solicitud: instalar la aplicación TeamWheels en Microsoft Teams"
- id: teams_admin_mail_body
  translation: |
    Hola:

    Me gustaría probar TeamWheels, una aplicación de coche compartido para empleados integrada en Microsoft Teams (gratis durante 30 días, sin tarjeta de crédito).

    ¿Podrías habilitarla para nuestra organización?

    - Instalar en Teams: {{ .Install }}
    - Ficha en Microsoft Marketplace: {{ .Marketplace }}
    - Microsoft 365 Publisher Attestation (seguridad, tratamiento de datos, cumplimiento): {{ .Attestation }}

    Puntos clave: inicio de sesión mediante Microsoft Entra ID (se aplican vuestras directivas de acceso condicional), datos alojados en Francia en Azure y cifrados en reposo, ningún dato compartido con terceros, conforme con el RGPD.

    En el Centro de administración de Teams: Aplicaciones de Teams > Administrar aplicaciones > buscar «TeamWheels» > Permitir.

    ¡Gracias!
