# ── Build ──────────────────────────────────────────────────────────────────────
[build]
publish = "public"
command = "yarn project-setup && yarn build"

[build.environment]
HUGO_VERSION = "0.115.1"
GO_VERSION   = "1.20.5"
HUGO_BASEURL = "/"

# ── Markdown content negotiation ───────────────────────────────────────────────
# Serve Hugo-generated .md siblings when agents send `Accept: text/markdown`.
# Implements the same negotiation as .htaccess (for Apache) but at the CDN edge.
# See https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/
[[edge_functions]]
path     = "/*"
function = "markdown-negotiation"
