<!DOCTYPE html>
<html>
<head>
  <title>{{ .Permalink }}</title>
  <link rel="canonical" href="{{ .Permalink }}" />
  <meta name="robots" content="noindex" />
  <meta charset="utf-8" />
  {{/* Smart language detection for root redirect */}}
  <script>
    (function () {
      try {
        var preferred = null;
        try { preferred = localStorage.getItem("preferred_lang"); } catch (e) {}

        function normalizePrimary(tag) {
          if (!tag || typeof tag !== "string") return null;
          return tag.toLowerCase().split("-")[0];
        }

        function pickLang() {
          if (preferred && (preferred === "en" || preferred === "fr")) return preferred;

          var candidates = [];
          if (Array.isArray(navigator.languages)) candidates = candidates.concat(navigator.languages);
          if (navigator.language) candidates.push(navigator.language);
          if (navigator.userLanguage) candidates.push(navigator.userLanguage);

          for (var i = 0; i < candidates.length; i++) {
            if (normalizePrimary(candidates[i]) === "fr") return "fr";
          }
          return "en";
        }

        var lang = pickLang();
        var target = "/" + lang + "/";
        window.location.replace(target + window.location.search + window.location.hash);
      } catch (e) {
        // fallback to default language redirect
        window.location.replace("{{ .Permalink }}");
      }
    })();
  </script>
  {{/* Fallback for browsers with JS disabled */}}
  <noscript>
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}" />
  </noscript>
</head>
<body>
  <p>Redirecting to <a href="{{ .Permalink }}">{{ .Permalink }}</a>…</p>
</body>
</html>
