{{- /* CSS + click-to-play script for partials/video-facade.html. The homepage
       calls it once; the `launch-video` shortcode emits it with each embed
       (the script skips frames it has already bound). */ -}}
  <style>
    .hero-video{position:relative}
    .hero-demo-video__frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:.75rem;overflow:hidden;background:#0b132b;box-shadow:0 1.25rem 60px rgba(11,19,43,.28)}
    /* --fit: the facade takes the thumbnail's own shape (the animated
       banner SVG) on a transparent background; 16:9 once playing. */
    .hero-demo-video__frame--fit{aspect-ratio:auto;background:transparent;box-shadow:none;overflow:visible}
    .hero-demo-video__frame--fit.is-playing{aspect-ratio:16/9;background:#0b132b;box-shadow:0 1.25rem 60px rgba(11,19,43,.28);overflow:hidden}
    .hero-demo-video__facade{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer}
    .hero-demo-video__poster{width:100%;height:100%;display:block;object-fit:contain}
    .hero-demo-video__frame--fit .hero-demo-video__poster{height:auto}
    /* Play button: gradient disc with a large rounded triangle, a frosted
       halo ring around it and a soft pulse; grows slightly on hover. */
    .hero-demo-video__play{position:absolute;inset:0;margin:auto;width:4.5rem;height:4.5rem;display:flex;align-items:center;justify-content:center;color:#4d51a9;transition:transform .25s cubic-bezier(.2,.8,.2,1),color .25s ease}
        .hero-demo-video__play svg{width:4rem;height:4rem;filter:drop-shadow(0 4px 10px rgba(11,19,43,.3))}
    .hero-demo-video__facade:hover .hero-demo-video__play,.hero-demo-video__facade:focus-visible .hero-demo-video__play{transform:scale(1.1);color:#3f4392}
    .hero-demo-video__label{position:absolute;left:.75rem;bottom:.75rem;padding:.3rem .7rem;border-radius:999px;background:rgba(11,19,43,.72);color:#fff;font-size:.8rem;font-weight:600;line-height:1.2}
    /* On the SVG the centre is the TeamWheels logo: sit the play button in
       the empty lower-left area of the illustration instead. */
    .hero-demo-video__frame--fit .hero-demo-video__play{inset:auto;left:20%;top:72%;margin:-2.25rem 0 0 -2.25rem}
    .hero-demo-video__frame--fit .hero-demo-video__label{left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap}
    .hero-demo-video__player{width:100%;height:100%;display:block;border:0;background:#0b132b;object-fit:contain}
    .hero-demo-video__link{font-weight:500}
    /* YouTube clips (partials/youtube-video.html): light thumbnails, so a
       hairline instead of the dark frame; title + blurb under each card. */
    .yt-video{margin:0}
    .yt-video .hero-demo-video__frame{background:#eef0fa;box-shadow:0 .5rem 1.75rem rgba(11,19,43,.12);outline:1px solid rgba(11,19,43,.08)}
    .yt-video .hero-demo-video__poster{object-fit:cover}
    .yt-video .hero-demo-video__play{width:3.75rem;height:3.75rem;border-radius:50%;background:#fff;box-shadow:0 .4rem 1.25rem rgba(11,19,43,.25)}
    .yt-video .hero-demo-video__play svg{width:2rem;height:2rem;filter:none;margin-left:.15rem}
    .yt-video__title{margin:1rem 0 .4rem}
    .yt-video__text{margin:0;font-size:.95rem}
    .content figure.yt-video{display:block;max-width:40rem;margin:2rem auto}
    .content figure.yt-video .hero-demo-video__poster{margin:0;border-radius:0;box-shadow:none}
    .hero-demo-section__lede{max-width:42rem;margin-left:auto;margin-right:auto}
    @media(prefers-reduced-motion:reduce){.hero-demo-video__play{transition:none}}
  </style>
  <script>
    (function () {
      // Poster facade → real <video> on the first click (a user gesture,
      // so play() with sound is allowed). Starting a clip pauses any other video
      // on the page.
      document.querySelectorAll('.hero-demo-video__frame[data-demo-video]').forEach(function (frame) {
        var facade = frame.querySelector('[data-play-demo]');
        if (!facade || frame.dataset.bound) return;
        frame.dataset.bound = '1';
        facade.addEventListener('click', function () {
          document.querySelectorAll('video').forEach(function (o) { o.pause(); });
          // YouTube clip: the iframe (and with it every request to Google)
          // only exists after this click. youtube-nocookie.com = YouTube's
          // privacy-enhanced mode; the referrer policy is required by the
          // embedded player (error 153 without it).
          if (frame.dataset.youtube) {
            var f = document.createElement('iframe');
            f.className = 'hero-demo-video__player';
            f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(frame.dataset.youtube) +
              '?autoplay=1&rel=0&playsinline=1&hl=' + encodeURIComponent(document.documentElement.lang || 'en');
            f.title = frame.dataset.title || 'YouTube video';
            f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            f.referrerPolicy = 'strict-origin-when-cross-origin';
            f.allowFullscreen = true;
            frame.classList.add('is-playing');
            frame.replaceChild(f, facade);
            return;
          }
          var v = document.createElement('video');
          v.className = 'hero-demo-video__player';
          v.controls = true;
          v.setAttribute('playsinline', '');
          v.preload = 'auto';
          if (frame.dataset.poster) v.poster = frame.dataset.poster;
          [['mp4', 'video/mp4'], ['webm', 'video/webm']].forEach(function (pair) {
            var src = frame.dataset[pair[0]];
            if (!src) return;
            var s = document.createElement('source');
            s.src = src;
            s.type = pair[1];
            v.appendChild(s);
          });
          v.addEventListener('play', function () {
            document.querySelectorAll('video').forEach(function (o) { if (o !== v) o.pause(); });
          });
          frame.classList.add('is-playing');
          frame.replaceChild(v, facade);
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        });
      });
    })();
  </script>
