<!-- theme meta -->
<meta name="theme-name" content="delta-hugo" />

<!-- favicon -->
{{ partialCached "favicon" . }}


<!-- manifest -->
{{ partialCached "manifest" . }}


<!-- site verifications -->
{{ partialCached "site-verifications.html" . }}


<!-- canonical URL -->
<link rel="canonical" href="{{ .Permalink }}" />

<!-- opengraph and twitter card -->
{{ partial "basic-seo.html" . }}


<!-- custom script -->
{{ partialCached "custom-script.html" . }}


<!-- google tag manager -->
{{ partialCached "gtm.html" . }}

<!-- Deferred analytics & third-party scripts for mobile performance -->
<script>
function _loadDeferred() {
  {{ with site.Config.Services.GoogleAnalytics.ID }}
  var gs=document.createElement("script");gs.src="https://www.googletagmanager.com/gtag/js?id={{ . }}";gs.async=1;document.head.appendChild(gs);
  window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date());gtag('config','{{ . }}');
  {{ end }}
  {{ with site.Params.crisp_chat }}{{ if .enable }}
  window.$crisp=[];window.CRISP_WEBSITE_ID="{{ .crisp_website_id }}";
  var cs=document.createElement("script");cs.src="https://client.crisp.chat/l.js";cs.async=1;document.head.appendChild(cs);
  {{ end }}{{ end }}
  {{ with site.Params.ms_clarity }}{{ if .enable }}
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,"clarity","script","{{ .ms_clarity_code }}");
  {{ end }}{{ end }}
}
if(typeof requestIdleCallback!=="undefined"){requestIdleCallback(_loadDeferred)}else{setTimeout(_loadDeferred,3000)}
</script>

<!-- Custom SEO Schema -->
{{ partial "seo/schema.html" . }}
{{ partial "seo/hreflang.html" . }}
