################################### Dutch languages ######################################
# One locale per country: Belgian and Dutch employer rules differ (SPEC.md).
# The key sets the URL prefix (/nl-be/, /nl/); params.hreflang is the tag
# printed in hreflang, sitemaps, <html lang> and schema inLanguage.
# Every Dutch page ships as draft: true. A locale only appears in the switcher,
# alias redirects and WebMCP once its home page is published.
[nl-be]
label = "Nederlands (België)"
locale = "nl-be"
contentDir = "content/dutch-be"
weight = 5

[nl-be.params]
hreflang = "nl-BE"
home = "Home"
copyright = "Copyright © 2024 TeamWheels. Alle rechten voorbehouden."
# meta
title = "TeamWheels - Carpoolen voor bedrijven in Microsoft Teams"
description = "TeamWheels maakt van Microsoft Teams een carpoolplatform voor uw organisatie: minder woon-werkverkeer met de auto, minder parkeerdruk, in 5 minuten live. 30 dagen gratis."

