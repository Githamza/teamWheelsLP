#################### default parameters ################################
# favicon
favicon = "images/favicon.png"
# logo
logo = "images/logo.png"
logo_dark = "images/logo-light.png"
# use `x` with logo_width, example: "100x"
# Note: logo_width is not work with .svg file
logo_width = "147x"
# logo text will only show when logo is missing.
logo_text = "TeamWheels"
# Google Ads measurement ID for gtag (root param — do not nest under a `[section]`)
google_ads_id = "AW-11145026311"

# purgeCSS
purge_css = true
# content-gallery
content_gallery = false
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>" 
custom_script= "" 

# Main Sections
mainSections= ["blog"]

# copyright
theme_copyright = true

# career form action
career_form_action = "#!" # career form works with https://formspree.io or any formspree-alternatives

# OpenGraph / Twitter Card metadata
description = "TeamWheels - Enterprise employee carpooling platform for Microsoft Teams. Reduce Scope 3 commute emissions, cut parking costs, and improve employee retention. Free 30-day trial. Deploy in 5 minutes."
author = "TeamWheels"
image = "images/logo.png" # this image will be used as fallback if a page has no image of its own

# Preloader
[preloader]
enable = false
preloader = "images/logo.png" # use jpg, png, svg or gif format.

# contact info
[contact_info]
address = ""
mobile = ""
email = "contact@teamwheels.fr"
# contact form action
contact_form_action = "https://formspree.io/f/mnqepday" # contact form works with https://formspree.io or any formspree-alternatives

# Navigation buttons
[navigation_button]
enable = false
label = "Log In"
link = "#!"
icon = "far fa-user"

[navigation_button_two]
enable = false
label = "Sign Up Now"
link = "#!"

# Call to action
[call_to_action]
enable = true
title = "Lancez le covoiturage dans votre entreprise"
subtitle = "Rejoignez les entreprises qui facilitent les trajets de leurs équipes et réduisent leur empreinte carbone. <br> <strong>Offre de lancement :</strong> Essai gratuit 30 jours + déploiement accompagné."
button_label = "Commencer mon essai gratuit →"
button_link = "contact/"
image = "images/cta.png"


# seo meta data for OpenGraph / Twitter Card
[metadata]
keywords = [ "corporate carpooling", "enterprise carpooling platform", "employee carpooling program", "Microsoft Teams carpooling", "commute management platform", "commuter benefits", "sustainable commuting", "employee transportation management", "Scope 3 employee commuting", "Scope 3 Category 7", "ESG commuting solution", "carpooling software", "reduce parking demand", "employee rideshare program", "corporate mobility solution", "employee commute benefits", "workplace carpooling app", "green commuting", "carbon reduction commuting", "pre-tax commuter benefits", "employee retention commute", "corporate sustainability commuting", "covoiturage entreprise", "Microsoft Teams covoiturage", "covoiturage domicile travail"]
description = "TeamWheels - Enterprise carpooling platform integrated into Microsoft Teams. Reduce Scope 3 commute emissions, cut parking costs by 30%, and boost employee retention. Free 30-day trial. Deploy in 5 minutes."
author = "TeamWheels"
image = "images/logo.png" # this image will be used as fallback if a page has no image of its own

