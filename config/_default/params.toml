#################### default parameters ################################
# favicon
favicon = "images/favicon.png"
# logo
logo = "images/logo.png"
logo_dark = "images/logo-light.png"
# use `x` with logo_width, example: "100x"
# Note: logo_width is not work with .svg file
logo_width = "147x"
# logo text will only show when logo is missing.
logo_text = "TeamWheels"
# purgeCSS
purge_css = false
# content-gallery
content_gallery = true
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>" 
custom_script= "" 

# Main Sections
mainSections= ["blog"]

# copyright
theme_copyright = true

# career form action
career_form_action = "#!" # career form works with https://formspree.io or any formspree-alternatives

# OpenGraph / Twitter Card metadata
description = "TeamWheels - Corporate carpooling integrated into Microsoft Teams. Reduce commute costs and carbon footprint. Free 30-day trial. Deploy in 5 minutes."
author = "TeamWheels"
image = "images/logo.png" # this image will be used as fallback if a page has no image of its own

# Preloader
[preloader]
enable = true
preloader = "images/logo.png" # use jpg, png, svg or gif format.

# contact info
[contact_info]
address = ""
mobile = ""
email = "contact@teamwheels.fr"
# contact form action
contact_form_action = "https://formspree.io/f/mnqepday" # contact form works with https://formspree.io or any formspree-alternatives

# Navigation buttons
[navigation_button]
enable = false
label = "Log In"
link = "#!"
icon = "far fa-user"

[navigation_button_two]
enable = false
label = "Sign Up Now"
link = "#!"

# Call to action
[call_to_action]
enable = true
title = "Lancez le covoiturage dans votre entreprise"
subtitle = "Rejoignez les entreprises qui facilitent les trajets de leurs équipes et réduisent leur empreinte carbone. <br> <strong>Offre de lancement :</strong> Essai gratuit 30 jours + déploiement accompagné."
button_label = "Commencer mon essai gratuit →"
button_link = "contact/"
image = "images/cta.png"


# seo meta data for OpenGraph / Twitter Card
[metadata]
keywords = [ "corporate carpooling", "Microsoft Teams carpooling", "employee carpooling", "commute benefits", "sustainable commuting", "B2B carpooling app", "carbon reduction", "ESG commuting", "enterprise carpooling", "carpooling software", "employee benefits", "covoiturage entreprise", "Microsoft Teams covoiturage", "covoiturage domicile travail"]
description = "TeamWheels - Corporate carpooling integrated into Microsoft Teams. Reduce commute costs and carbon footprint. Free 30-day trial. Deploy in 5 minutes."
author = "TeamWheels"
image = "images/logo.png" # this image will be used as fallback if a page has no image of its own

# MS Clarity
[ms_clarity]
enable = true
ms_clarity_code = "kzo1gtmmjs"

# Crisp Chat
[crisp_chat]
enable = true
crisp_website_id = "4be5950a-3626-48b5-984f-4127bec3f41f"

